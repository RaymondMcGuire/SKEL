[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skel"
version = "1.0.0"
description = "SKEL model Loader."
authors = [{name = "Marilyn Keller"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "motion",
    "machine learning",
    "sequences",
    "smpl",
    "computer graphics",
    "computer vision",
    "3D",
    "meshes",
    "skel",
]
dependencies = [
  "wheel",
  "chumpy @ git+https://github.com/MarilynKeller/chumpy",
  "aitviewer @ git+https://github.com/MarilynKeller/aitviewer",
  "PyQt5==5.15.11; sys_platform == 'win32'",
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-sip==12.17.0; sys_platform == 'win32'",
  "torch>=1.6.0",
  "smplx",
  "trimesh",
  "tqdm",
  "matplotlib",
  "moderngl-window==2.4.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skel*"]

# Configure PyTorch with CUDA 12.8 support
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]